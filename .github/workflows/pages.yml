# Deploys site/ (built locally by scripts/build_site.py, committed) to GitHub Pages.
# WHY no build in CI: the hero and gallery are recorded from a maker's page saved by `mdify capture`; that page is not
# committed (it is the maker's), so CI publishes the pictures made from it instead of re-fetching it on every push.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
